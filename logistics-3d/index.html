<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RioTrans — логістика, що рухає Європу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#1550c8;--ink:#14161a;--muted:#5f6b78;--bg:#e9edf1}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* header */
  header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:22px 36px}
  .logo{font-weight:800;font-size:22px;letter-spacing:.01em;color:var(--red);text-decoration:none;display:flex;align-items:center;gap:8px}
  .logo i{width:22px;height:22px;border-radius:6px;background:var(--red);display:inline-block;position:relative}
  .logo i::after{content:"";position:absolute;inset:6px 5px 6px 9px;border-left:3px solid #fff;border-top:3px solid #fff;transform:rotate(135deg)}
  nav{display:flex;gap:28px;align-items:center}
  nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;opacity:.8}
  nav a:hover{opacity:1}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff!important;opacity:1!important;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(21,80,200,.35)}

  /* hero */
  #hero{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,#9fb6d1 0%,#d3deea 45%,#eef1f4 100%);transform-origin:50% 55%}
  #hero .mtn{position:absolute;left:50%;bottom:-4%;width:max(1400px,120vw);transform:translateX(-50%)}
  .cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.55) 45%,rgba(255,255,255,0));filter:blur(6px);animation:drift linear infinite;will-change:transform}
  @keyframes drift{from{transform:translateX(-60vw)}to{transform:translateX(130vw)}}
  .hero-title{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2;width:100%}
  .hero-title h1{font-weight:300;font-size:clamp(42px,9vw,150px);letter-spacing:.45em;margin-right:-.45em;color:#55636f}
  .hero-title p{margin-top:14px;font-size:clamp(14px,1.4vw,18px);color:#56636f;letter-spacing:.2em;text-transform:uppercase}
  .hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:4;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#56636f;display:flex;flex-direction:column;align-items:center;gap:12px}
  .hint span{width:1px;height:46px;background:linear-gradient(#56636f,transparent);animation:hint 1.8s ease-in-out infinite;transform-origin:top}
  @keyframes hint{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

  /* steps (scroll spacers) */
  .step{height:140vh}

  /* info card */
  #card{position:fixed;left:36px;bottom:36px;z-index:20;width:400px;max-width:calc(100vw - 32px);
    background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(20,30,45,.16);
    transition:opacity .5s,transform .5s}
  #card.hidden{opacity:0;transform:translateY(20px);pointer-events:none}
  #card .inner{transition:opacity .25s,transform .25s}
  #card .inner.swap{opacity:0;transform:translateY(8px)}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  #card h2{font-size:28px;line-height:1.15;font-weight:600;margin:10px 0 12px;letter-spacing:-.01em}
  #card p{font-size:15px;line-height:1.55;color:var(--muted)}
  .stats{display:flex;gap:28px;margin-top:20px;padding-top:18px;border-top:1px solid #e4e8ec}
  .stats b{display:block;font-size:24px;font-weight:600}
  .stats small{font-size:12px;color:var(--muted)}
  #card .btn{margin-top:20px}

  /* chapter dots */
  #dots{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:14px}
  #dots button{width:10px;height:10px;border-radius:50%;border:2px solid #9aa6b2;background:transparent;cursor:pointer;padding:0;transition:all .3s;position:relative}
  #dots button.on{background:var(--red);border-color:var(--red);transform:scale(1.3)}
  #dots button span{position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink);opacity:0;transition:opacity .2s;pointer-events:none}
  #dots button:hover span{opacity:1}

  #bar{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:40;width:0}

  /* 3D pins */
  .pin{position:fixed;left:0;top:0;z-index:5;pointer-events:none;transform:translate(-50%,-100%);
    background:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;white-space:nowrap;
    box-shadow:0 6px 18px rgba(20,30,45,.18);transition:opacity .4s;display:flex;align-items:center;gap:7px}
  .pin::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
  .pin::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:16px;background:rgba(20,22,26,.4)}

  @media (max-width:760px){
    header{padding:16px}
    nav a:not(.btn){display:none}
    #card{left:16px;right:16px;bottom:16px;width:auto;padding:20px}
    #card h2{font-size:22px}
    #dots{right:12px}
    .pin{font-size:11px;padding:5px 10px}
  }
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <a class="logo" href="#" data-go="0"><i></i>RIOTRANS</a>
  <nav>
    <a href="#" data-go="1">Склади</a>
    <a href="#" data-go="3">Море</a>
    <a href="#" data-go="4">Залізниця</a>
    <a href="#" data-go="5">Авіа</a>
    <a href="#" class="btn" data-go="6">Отримати розрахунок</a>
  </nav>
</header>

<canvas id="scene"></canvas>

<div id="hero">
  <svg class="mtn" viewBox="0 0 1400 600" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f8e9e"/><stop offset="1" stop-color="#d3dbe3"/></linearGradient>
      <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7b4c1"/><stop offset="1" stop-color="#e3e8ed"/></linearGradient>
    </defs>
    <polygon fill="url(#m2)" points="0,600 120,470 260,400 380,330 460,360 560,300 600,330 0,600"/>
    <polygon fill="url(#m2)" points="900,600 1000,380 1100,310 1180,350 1260,300 1400,420 1400,600"/>
    <polygon fill="url(#m1)" points="200,600 380,430 540,250 650,120 700,85 760,130 860,240 1040,380 1250,600"/>
    <polygon fill="#f7f9fb" points="560,228 650,120 700,85 760,130 840,218 800,200 765,232 722,190 690,232 650,205 610,240"/>
    <polygon fill="#e3e8ee" points="700,85 760,130 840,218 800,200 765,232 722,190"/>
  </svg>
  <div class="hero-title">
    <h1>RIOTRANS</h1>
    <p>Логістика, що рухає Європу</p>
  </div>
  <div class="hint">Гортайте<span></span></div>
</div>

<div id="pins"></div>

<aside id="card" class="hidden" aria-live="polite"><div class="inner"></div></aside>
<div id="dots"></div>

<main>
  <section class="step"></section>
  <section class="step"></section>
  <section class="step"></section>
  <section class="step"></section>
  <section class="step"></section>
  <section class="step"></section>
  <section class="step"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ---------------- content ---------------- */
const CH = [
  {name:'Старт'},
  {name:'Склади', k:'01 · Склади', h:'Розумні склади поруч із вашими клієнтами',
   p:'120 000 м² класу A з WMS, що бачить кожну палету в реальному часі. Комплектуємо замовлення за 2 години.',
   s:[['120k','м² площ'],['99.8%','точність відвантажень']]},
  {name:'Авто', k:'02 · Автоперевезення', h:'Власний автопарк, що не спить',
   p:'1 200 тягачів Euro 6 щодня курсують між 28 країнами. Кожен рейс — онлайн на вашій карті.',
   s:[['1 200','тягачів'],['28','країн']]},
  {name:'Море', k:'03 · Морські перевезення', h:'Від причалу до складу — одним контрактом',
   p:'FCL та LCL через 40 портів світу, митне оформлення та доставка «останньої милі».',
   s:[['40','портів'],['14 дн','Шанхай → Гданськ']]},
  {name:'Залізниця', k:'04 · Залізниця', h:'Інтермодальні рішення з меншим CO₂',
   p:'Контейнерні потяги між Азією та Європою: швидше за море, дешевше за авіа і на 70% чистіше за авто.',
   s:[['−70%','CO₂'],['18 дн','Китай → ЄС']]},
  {name:'Авіа', k:'05 · Авіадоставка', h:'Терміново? Долетить за 24 години',
   p:'Власний аеро-хаб, чартери та консолідовані рейси для чутливих і цінних вантажів.',
   s:[['24 год','до дверей'],['150+','напрямків']]},
  {name:'Контакт', k:'06 · Разом', h:'Одна мережа. Будь-який вантаж.',
   p:'Розкажіть, що потрібно перевезти, і ми прорахуємо найкращий маршрут за 15 хвилин.',
   s:[['15 хв','на розрахунок'],['24/7','підтримка']], cta:'Отримати розрахунок'}
];

/* camera keyframes: position + look-at target */
const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const KEYS = [
  {p:V(40,260,260), t:V(40,0,0)},
  {p:V(38,30,48),   t:V(0,4,2)},
  {p:V(-30,12,52),  t:V(5,3,28)},
  {p:V(100,42,30),  t:V(66,0,-18)},
  {p:V(-12,30,8),   t:V(-52,0,-28)},
  {p:V(218,46,128), t:V(165,2,58)},
  {p:V(40,175,195), t:V(40,0,-5)}
];

/* ---------------- helpers ---------------- */
const RED='#1550c8';
let seed=7; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)};

const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#e9edf1');
scene.fog=new THREE.Fog('#e9edf1',180,520);
const camera=new THREE.PerspectiveCamera(32,1,1,2000);

scene.add(new THREE.HemisphereLight(0xffffff,0x9aa6b2,0.42));
const sun=new THREE.DirectionalLight(0xfff6ea,0.62);
sun.position.set(120,160,110); sun.target.position.set(40,0,10);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-230,right:230,top:230,bottom:-230,near:10,far:600});
sun.shadow.bias=-0.0005;
scene.add(sun,sun.target);

const mats={}, geos={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.85}));
function box(w,h,d,c,x,y,z,parent=scene){
  const key=w+'|'+h+'|'+d;
  const g=geos[key]||(geos[key]=new THREE.BoxGeometry(w,h,d));
  const m=new THREE.Mesh(g,typeof c==='string'?mat(c):c);
  m.position.set(x,y+h/2,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m;
}
function tex(text,bg,fg,w=1024,h=160){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font=`800 ${h*.58}px Inter, Arial, sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+3);
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t;
}

/* ---------------- world ---------------- */
function build(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),mat('#cdd3d9'));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  // water + quay
  const water=new THREE.Mesh(new THREE.PlaneGeometry(500,300),
    new THREE.MeshStandardMaterial({color:'#5fb5e3',roughness:.3,metalness:.15}));
  water.rotation.x=-Math.PI/2; water.position.set(282,.04,-162); water.receiveShadow=true; scene.add(water);
  box(500,.9,1.2,'#c3c9d0',282,0,-12);
  box(1.2,.9,300,'#c3c9d0',32,0,-162);

  // paving
  box(64,.08,42,'#d8dde2',-6,0,6);
  box(80,.08,26,'#d8dde2',72,0,1);
  box(100,.08,20,'#d8dde2',165,0,54);

  // road
  box(600,.1,7,'#c4c9cf',20,0,30);
  for(let x=-275;x<315;x+=8) box(3,.12,.25,'#ffffff',x,0,30);

  /* --- warehouse campus --- */
  box(34,9,20,'#f5f6f4',0,0,0);
  box(34.3,.6,20.3,'#dde2e7',0,9,0);
  box(34.2,1.8,20.2,RED,0,7,0);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(16,1.8),new THREE.MeshBasicMaterial({map:tex('RIOTRANS',RED,'#fff')}));
  sign.position.set(0,7.9,10.11); scene.add(sign);
  for(let i=0;i<6;i++){
    const x=-12.5+i*5;
    box(3.2,4.2,.2,'#59616b',x,0,10.05);
    if(i!==2){const t=makeTruck();t.rotation.y=-Math.PI/2;t.position.set(x,0,16.5);scene.add(t);}
  }
  // office tower
  box(10,14,10,'#cfd9e3',-24,0,-1);
  for(let f=1;f<14;f+=2.2) box(10.15,.5,10.15,'#f4f5f7',-24,f,-1);
  box(10.3,.6,10.3,RED,-24,14,-1);
  // rooftop units
  for(let i=0;i<4;i++) box(2.5,1,2.5,'#c7ced6',-10+i*7,9.6,-4);

  /* --- port --- */
  [50,66,82].forEach(portCrane);
  const pal=[RED,'#7fb2ec','#f2f2f2','#9aa5b1','#e8a33d',RED];
  for(let i=0;i<10;i++) for(const z of [0,3,6,9]){
    if(rnd()<.18) continue;
    const n=1+Math.floor(rnd()*3);
    for(let k=0;k<n;k++) box(6,2.5,2.4,pal[Math.floor(rnd()*pal.length)],38+i*7,k*2.5,z);
  }
  const docked=makeShip(); docked.position.set(66,0,-30); scene.add(docked);
  movingShip=makeShip(); movingShip.scale.setScalar(.9); scene.add(movingShip);

  /* --- rail --- */
  box(240,.3,24,'#cbc5bb',-91,0,-28);
  const TR=[-21,-25.5,-30,-34.5];
  const sleeper=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,.15,2.2),mat('#8a7f72'),TR.length*160);
  let si=0; const m4=new THREE.Matrix4();
  for(const z of TR){
    box(240,.22,.18,'#7b8188',-91,.3,z-.75); box(240,.22,.18,'#7b8188',-91,.3,z+.75);
    for(let x=-210;x<30;x+=1.5){m4.makeTranslation(x,.38,z);sleeper.setMatrixAt(si++,m4);}
  }
  sleeper.receiveShadow=true; scene.add(sleeper);
  // train shed at the yard's end
  box(14,9,26,'#f4f5f7',23,0,-28); box(14.2,1.6,26.2,RED,23,7.4,-28);
  // gantry over the tracks
  const G=new THREE.Group();
  for(const [dx,dz] of [[-4,-17],[4,-17],[-4,-42],[4,-42]]) box(1,13,1,RED,dx,0,dz,G);
  box(1.3,1.6,27,RED,-4,13,-29.5,G); box(1.3,1.6,27,RED,4,13,-29.5,G);
  box(9.3,1,1.3,RED,0,13.3,-17,G); box(9.3,1,1.3,RED,0,13.3,-42,G);
  box(6,2,4,'#f4f5f7',0,11.2,-30,G);
  box(.15,5,.15,'#333',0,6.2,-30,G); box(6.2,.5,2.6,'#333',0,6,-30,G);
  G.position.x=-52; scene.add(G);
  for(let i=0;i<7;i++){const n=1+Math.floor(rnd()*3);for(let k=0;k<n;k++)box(6,2.5,2.4,pal[Math.floor(rnd()*pal.length)],-80+i*7,k*2.5,-46);}
  const parked=makeTrain(6); parked.position.x=-75; parked.position.z=TR[2]; scene.add(parked);
  parked.userData.static=true;
  trains.push({g:makeTrain(9),z:TR[0],speed:9,x:22});
  trains.push({g:makeTrain(7),z:TR[3],speed:7,x:-120});
  trains.forEach(t=>{t.g.position.z=t.z;scene.add(t.g);});

  /* --- airport --- */
  box(80,7,8,'#f4f5f7',165,0,38); box(80.2,2,8.2,'#9fc3dd',165,3,38); box(80.4,.6,8.4,RED,165,7,38);
  box(110,.12,11,'#59616b',170,0,74);
  for(let x=120;x<225;x+=7) box(3.5,.15,.35,'#ffffff',x,0,74);
  box(120,.1,4,'#9aa3ad',170,0,64);
  [140,165,190].forEach(x=>{const p=makePlane();p.rotation.y=Math.PI/2;p.position.set(x,0,54);scene.add(p);});
  plane=makePlane(); scene.add(plane);
  // control tower
  box(3,16,3,'#f4f5f7',212,0,40); box(6,3,6,'#9fc3dd',212,16,40); box(6.4,.6,6.4,RED,212,19,40);

  /* --- road traffic --- */
  for(let i=0;i<8;i++){
    const dir=i%2?1:-1, t=makeTruck();
    if(dir<0) t.rotation.y=Math.PI;
    t.position.z=dir>0?28.3:31.7; scene.add(t);
    trucks.push({g:t,dir,x:-260+i*70+rnd()*30,speed:11+rnd()*5});
  }

  /* --- trees --- */
  const N=260, crowns=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.9,0),
    new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),N);
  const trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.25,.32,1.6,6),mat('#8b7d6b'),N);
  const greens=['#2e9e86','#3fb196','#279078','#59bfa2'].map(c=>new THREE.Color(c));
  const q=new THREE.Quaternion(), sc=new THREE.Vector3(), ps=new THREE.Vector3();
  let n=0, guard=0;
  while(n<N && guard++<8000){
    const x=-200+rnd()*440, z=-90+rnd()*220;
    if(blocked(x,z)) continue;
    const s=.7+rnd()*.7;
    sc.set(s,s*(1.1+rnd()*.5),s); ps.set(x,1.6*s+1.5*s,z);
    m4.compose(ps,q,sc); crowns.setMatrixAt(n,m4); crowns.setColorAt(n,greens[n%4]);
    sc.set(s,s,s); ps.set(x,.8*s,z); m4.compose(ps,q,sc); trunks.setMatrixAt(n,m4); n++;
  }
  crowns.count=trunks.count=n; crowns.castShadow=trunks.castShadow=true; scene.add(crowns,trunks);

  /* --- 3D clouds (seen from above) --- */
  for(let i=0;i<7;i++){
    const c=new THREE.Group(), cm=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:1,transparent:true,opacity:.6,depthWrite:false});
    for(let j=0;j<6;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(6+rnd()*6,12,10),cm);
      s.position.set((rnd()-.5)*26,(rnd()-.5)*4,(rnd()-.5)*12); s.scale.y=.55; c.add(s);}
    c.position.set(-150+rnd()*400,95+rnd()*40,-160+rnd()*90); c.userData.v=1+rnd()*2;
    clouds.push(c); scene.add(c);
  }
}
const blocked=(x,z)=>
  (x>-36&&x<30&&z>-16&&z<26)||(z>24&&z<36)||(x>28&&x<112&&z>-14&&z<16)||(x>29&&z<-9)||
  (x<32&&z>-50&&z<-14)||(x>110&&x<228&&z>30&&z<84);

function makeTruck(){
  const g=new THREE.Group();
  const side=new THREE.MeshStandardMaterial({map:tex('RIOTRANS',RED,'#fff',1024,240),roughness:.8});
  const m=[mat(RED),mat(RED),mat('#f2f2f2'),mat(RED),side,side];
  box(11,3.2,2.6,m,0,1,0,g);
  box(2.6,2.9,2.6,RED,7,.9,0,g);
  box(.12,1.1,2.2,'#2b3440',8.33,2.4,0,g);
  const wg=geos.w||(geos.w=new THREE.CylinderGeometry(.55,.55,.5,12));
  for(const x of [-4,-2.8,6.8,4.6]) for(const z of [-1.2,1.2]){
    const w=new THREE.Mesh(wg,mat('#22262b')); w.rotation.x=Math.PI/2; w.position.set(x,.55,z); g.add(w);
  }
  return g;
}
function portCrane(x){
  const g=new THREE.Group();
  for(const [dx,dz] of [[-3,-2],[3,-2],[-3,6],[3,6]]) box(.9,16,.9,RED,dx,0,dz,g);
  box(7,1,.9,RED,0,15,-2,g); box(7,1,.9,RED,0,15,6,g);
  box(1.4,1.4,34,RED,0,16,-6,g);
  box(3,2.4,3,'#f2f2f2',0,13.6,-12,g);
  box(.15,7,.15,'#333',0,6.6,-20,g); box(6,.5,2.6,'#333',0,6.2,-20,g);
  g.position.set(x,0,-10); scene.add(g);
}
function makeShip(){
  const g=new THREE.Group(), pal=[RED,'#7fb2ec','#f2f2f2','#9aa5b1','#e8a33d'];
  box(40,3.5,10,'#26303b',0,-1,0,g); box(40.1,.8,10.1,RED,0,-.9,0,g);
  box(5,7,9,'#f4f5f7',-16,2.5,0,g); box(5.1,.8,9.1,'#1d2530',-16,7.6,0,g);
  box(2,3,2,RED,-18,9.5,0,g);
  for(let x=-10;x<18;x+=6.3) for(const z of [-2.6,0,2.6]){
    const n=1+Math.floor(rnd()*3); for(let k=0;k<n;k++) box(6,2.4,2.4,pal[Math.floor(rnd()*pal.length)],x,2.5+k*2.4,z,g);
  }
  return g;
}
function makeTrain(cars){
  const g=new THREE.Group(), pal=[RED,'#7fb2ec','#f2f2f2','#e8a33d','#9aa5b1'];
  const loco=new THREE.Group(); box(9,3.6,2.9,RED,0,.5,0,loco); box(.1,1,2.4,'#2b3440',-4.52,2.8,0,loco);
  loco.userData.off=0; g.add(loco);
  for(let i=1;i<=cars;i++){
    const c=new THREE.Group(); box(9.6,.6,2.8,'#3a3f46',0,.5,0,c);
    if(rnd()>.15) box(9,2.6,2.6,pal[Math.floor(rnd()*pal.length)],0,1.1,0,c);
    c.position.x=i*10.2; c.userData.off=i*10.2; g.add(c);
  }
  return g;
}
function makePlane(){
  const g=new THREE.Group(), W='#eef1f4';
  const fus=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,18,18),mat(RED)); fus.rotation.z=Math.PI/2; fus.position.y=3;
  const nose=new THREE.Mesh(new THREE.SphereGeometry(1.3,18,12),mat(RED)); nose.scale.x=1.7; nose.position.set(9,3,0);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(1.3,4,18),mat(RED)); tail.rotation.z=Math.PI/2; tail.position.set(-11,3,0);
  [fus,nose,tail].forEach(m=>{m.castShadow=true;g.add(m);});
  box(4,.35,22,W,1,2.4,0,g); box(3,4.5,.35,RED,-11,3.6,0,g); box(2.5,.3,8,W,-11.5,3.4,0,g);
  box(1.6,.25,1.5,'#2b3440',7.6,3.5,0,g).scale.set(1,1,1.4);
  for(const z of [-5.5,5.5]){const e=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,2.6,14),mat(W));e.rotation.z=Math.PI/2;e.position.set(2,1.9,z);e.castShadow=true;g.add(e);}
  for(const [x,z] of [[6,0],[0,-2],[0,2]]) box(.3,1.7,.3,'#333',x,0,z,g);
  return g;
}

/* ---------------- state & UI ---------------- */
const trucks=[], trains=[], clouds=[]; let movingShip, plane;
const hero=document.getElementById('hero'), card=document.getElementById('card'), inner=card.querySelector('.inner');
const bar=document.getElementById('bar'), dotsEl=document.getElementById('dots'), pinsEl=document.getElementById('pins');

for(let i=0;i<14;i++){
  const c=document.createElement('div'); c.className='cloud';
  const w=30+Math.random()*45; c.style.width=w+'vw'; c.style.height=w*.32+'vw';
  c.style.top=(28+Math.random()*62)+'%'; c.style.left='0';
  const d=50+Math.random()*60; c.style.animationDuration=d+'s'; c.style.animationDelay=-Math.random()*d+'s';
  c.style.zIndex=Math.random()<.4?3:1; c.style.opacity=.6+Math.random()*.4; hero.appendChild(c);
}

const maxScroll=()=>document.documentElement.scrollHeight-innerHeight;
const go=i=>window.scrollTo({top:maxScroll()*i/(KEYS.length-1),behavior:'smooth'});
CH.forEach((c,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',c.name);
  b.innerHTML=`<span>${c.name}</span>`;b.onclick=()=>go(i);dotsEl.appendChild(b);});
document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(+a.dataset.go);}));
inner.addEventListener('click',e=>{if(e.target.closest('.btn')){e.preventDefault();alert('Дякуємо! Менеджер звʼяжеться з вами протягом 15 хвилин.');}});

const PINS=[{t:'Хаб Київ-Захід',p:V(0,13,0)},{t:'Контейнерний термінал',p:V(66,21,-8)},
  {t:'Інтермодальний термінал',p:V(-52,17,-29)},{t:'Аеро-хаб RTR',p:V(165,11,38)}]
  .map(o=>{const d=document.createElement('div');d.className='pin';d.textContent=o.t;pinsEl.appendChild(d);return {...o,el:d};});

let shown=-1;
function setChapter(i){
  if(i===shown) return; shown=i;
  [...dotsEl.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  if(i===0){card.classList.add('hidden');return;}
  card.classList.remove('hidden');
  inner.classList.add('swap');
  setTimeout(()=>{const c=CH[i];
    inner.innerHTML=`<div class="kicker">${c.k}</div><h2>${c.h}</h2><p>${c.p}</p>
      <div class="stats">${c.s.map(s=>`<div><b>${s[0]}</b><small>${s[1]}</small></div>`).join('')}</div>
      ${c.cta?`<a href="#" class="btn">${c.cta} →</a>`:''}`;
    inner.classList.remove('swap');},220);
}

let mx=0,my=0,smx=0,smy=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;
  camera.fov=innerWidth<760?48:32;camera.updateProjectionMatrix();}
addEventListener('resize',resize);

/* ---------------- loop ---------------- */
const clock=new THREE.Clock(); let T=0, f=0;
const cp=new THREE.Vector3(), ct=new THREE.Vector3(), tmp=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05); T+=dt;
  const max=maxScroll(), raw=max>0?scrollY/max:0, ft=raw*(KEYS.length-1);
  f+=(ft-f)*Math.min(1,dt*3.5);

  // camera path with dwell at each chapter and an arc between them
  const i=Math.min(Math.floor(f),KEYS.length-2); let fr=smooth(.18,.82,f-i);
  cp.lerpVectors(KEYS[i].p,KEYS[i+1].p,fr); ct.lerpVectors(KEYS[i].t,KEYS[i+1].t,fr);
  if(i>0) cp.y+=Math.sin(fr*Math.PI)*22;
  smx+=(mx-smx)*.05; smy+=(my-smy)*.05;
  cp.x+=smx*2.5; cp.y-=smy*1.5;
  camera.position.copy(cp); camera.lookAt(ct);

  // hero fly-through
  const hp=clamp(scrollY/(innerHeight*1.1),0,1);
  hero.style.opacity=1-smooth(.15,.9,hp);
  hero.style.transform=`scale(${1+hp*1.6})`;
  hero.style.visibility=hp>=1?'hidden':'visible';
  bar.style.width=raw*100+'%';
  setChapter(Math.round(f));

  // animation
  for(const t of trucks){t.x+=t.dir*t.speed*dt; if(t.x>300)t.x=-270; if(t.x<-270)t.x=300; t.g.position.x=t.x;}
  for(const t of trains){t.x-=t.speed*dt; if(t.x<-300)t.x=22;
    t.g.position.x=t.x; t.g.children.forEach(c=>c.visible=t.x+c.userData.off<17);}
  const a=T*.04, sx=200+130*Math.cos(a), sz=-120+50*Math.sin(a);
  movingShip.position.set(sx,0,sz); movingShip.rotation.y=Math.atan2(-(50*Math.cos(a)),-130*Math.sin(a));
  const pt=(T%22), px=118+.62*pt*pt; plane.position.set(px,Math.max(0,(px-170))**2*.012,74);
  plane.rotation.z=clamp((px-170)*.01,0,.22); plane.visible=px<420;
  clouds.forEach(c=>{c.position.x+=c.userData.v*dt; if(c.position.x>300)c.position.x=-200;});

  // pins
  const pinOp=smooth(.6,1,f);
  for(const p of PINS){
    tmp.copy(p.p).project(camera);
    const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
    p.el.style.opacity=vis?pinOp:0;
    p.el.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight-16}px) translate(-50%,-100%)`;
  }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(()=>{
  build(); resize(); requestAnimationFrame(frame);
});
})();
</script>
