<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація на онлайн-курс</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 0 16px; line-height: 1.5; color: #1f2933; }
    header { padding: 24px 0 0; }
    form { display: grid; gap: 14px; margin-bottom: 24px; }
    .field { display: grid; gap: 4px; }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      font: inherit; padding: 8px 10px; border: 1px solid #9aa5b1; border-radius: 6px;
    }
    fieldset { border: 1px solid #cbd2d9; border-radius: 6px; }
    .req { color: #c0392b; }
    input:user-invalid, select:user-invalid { border-color: #c0392b; background: #fdecea; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; justify-self: start; }
    footer { color: #52606d; padding-bottom: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Реєстрація на онлайн-курс</h1>
    <p>Заповніть форму. Поля з <span class="req">*</span> — обов'язкові.</p>
  </header>

  <main>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Анкета учасника</h2>

      <form action="#" method="post">
        <div class="field">
          <label for="first-name">Ім'я <span class="req">*</span></label>
          <input type="text" id="first-name" name="first_name" required minlength="2" autocomplete="given-name" autofocus>
        </div>

        <div class="field">
          <label for="last-name">Прізвище <span class="req">*</span></label>
          <input type="text" id="last-name" name="last_name" required minlength="2" autocomplete="family-name">
        </div>

        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="age">Вік</label>
          <input type="number" id="age" name="age" min="14" max="99" step="1">
        </div>

        <div class="field">
          <label for="direction">Напрям навчання <span class="req">*</span></label>
          <select id="direction" name="direction" required>
            <option value="">— Оберіть напрям —</option>
            <option value="frontend">Frontend-розробка</option>
            <option value="backend">Backend-розробка</option>
            <option value="design">UI/UX-дизайн</option>
            <option value="ai">Вайб-кодинг з AI</option>
          </select>
        </div>

        <fieldset>
          <legend>Формат навчання <span class="req">*</span></legend>
          <input type="radio" id="format-online" name="format" value="online" required>
          <label for="format-online">Онлайн</label>
          <input type="radio" id="format-offline" name="format" value="offline">
          <label for="format-offline">Офлайн</label>
        </fieldset>

        <fieldset>
          <legend>Додаткові інтереси</legend>
          <input type="checkbox" id="int-git" name="interests" value="git">
          <label for="int-git">Git і GitHub</label><br>
          <input type="checkbox" id="int-ai" name="interests" value="ai">
          <label for="int-ai">AI-інструменти</label><br>
          <input type="checkbox" id="int-english" name="interests" value="english">
          <label for="int-english">Технічна англійська</label>
        </fieldset>

        <div class="field">
          <label for="comment">Коментар</label>
          <textarea id="comment" name="comment" rows="4" maxlength="500" placeholder="Що ви очікуєте від курсу?"></textarea>
        </div>

        <button type="submit">Зареєструватися</button>
      </form>
    </section>
  </main>

  <footer>
    <p><small>Дані нікуди не надсилаються — це навчальна форма без backend.</small></p>
  </footer>
</body>
</html>
